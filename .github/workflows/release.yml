name: Release

# Build PassGenerator.jar and publish it as a GitHub release whenever a
# version tag such as v1.4.0 is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ant
        run: |
          if ! command -v ant >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ant
          fi
          ant -version

      - name: Build jar
        working-directory: RandPassGenerator
        run: ant jar

      - name: Smoke test
        working-directory: RandPassGenerator
        run: |
          java -jar build/jar/PassGenerator.jar -pw 2
          java -jar build/jar/PassGenerator.jar -pp 2
          java -jar build/jar/PassGenerator.jar -k 2 -str 256

      - name: Prepare release files
        run: |
          mkdir dist
          cp RandPassGenerator/build/jar/PassGenerator.jar dist/
          (cd dist && sha256sum PassGenerator.jar > PassGenerator.jar.sha256)
          version="${GITHUB_REF_NAME#v}"
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$version" '
            /^CHANGES FROM/ { show = ($NF == v) ; next }
            show { print }
          ' RandPassGenerator/CHANGELOG.txt > dist/notes.md
          {
            echo
            echo "Requires a Java Runtime Environment, version 9 or later."
            echo
            echo "Run \`java -jar PassGenerator.jar -gui\` (or double-click the jar) for the graphical interface, or \`java -jar PassGenerator.jar\` for command-line usage."
          } >> dist/notes.md
          cat dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RandPassGenerator ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            dist/PassGenerator.jar dist/PassGenerator.jar.sha256
