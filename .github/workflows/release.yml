name: Release

# Build PassGenerator.jar and publish it as a GitHub release, either when
# a version tag such as v1.4.0 is pushed, or when this workflow is run by
# hand (Actions > Release > Run workflow) with the tag to create; in that
# case the tag is created on the commit the workflow runs on.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.4.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag must look like v1.2.3, got '$TAG'"; exit 1;; esac
          version="${TAG#v}"
          if ! grep -q "\"RandPassGen $version " RandPassGenerator/src/gov/nsa/ia/pass/RandPassGenerator.java; then
            echo "VERSION in RandPassGenerator.java does not match $version"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ant
        run: |
          if ! command -v ant >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ant
          fi
          ant -version

      - name: Build jar
        working-directory: RandPassGenerator
        run: ant jar

      - name: Smoke test
        working-directory: RandPassGenerator
        run: |
          java -jar build/jar/PassGenerator.jar -pw 2
          java -jar build/jar/PassGenerator.jar -pp 2
          java -jar build/jar/PassGenerator.jar -k 2 -str 256

      - name: Prepare release files
        run: |
          mkdir dist
          cp RandPassGenerator/build/jar/PassGenerator.jar dist/
          (cd dist && sha256sum PassGenerator.jar > PassGenerator.jar.sha256)
          version="${TAG#v}"
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$version" '
            /^CHANGES FROM/ { show = ($NF == v) ; next }
            show { print }
          ' RandPassGenerator/CHANGELOG.txt > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No CHANGELOG.txt section for $version"; exit 1
          fi
          {
            echo
            echo "Requires a Java Runtime Environment, version 9 or later."
            echo
            echo "Run \`java -jar PassGenerator.jar -gui\` (or double-click the jar) for the graphical interface, or \`java -jar PassGenerator.jar\` for command-line usage."
          } >> dist/notes.md
          cat dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "RandPassGenerator ${TAG#v}" \
            --notes-file dist/notes.md \
            dist/PassGenerator.jar dist/PassGenerator.jar.sha256
